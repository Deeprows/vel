<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.3"/>
  
  <!-- Speed Lines -->
  <path d="M60 360 L200 360" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <path d="M90 390 L180 390" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
  <path d="M40 330 L160 330" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" opacity="0.25"/>

  <!-- Racing Car Silhouette -->
  <g filter="url(#glow)">
    <path d="M120 330 C150 330 180 325 210 290 L260 215 C280 185 320 180 365 195 L420 250 C450 260 480 280 480 320 L480 340 C480 350 470 355 455 355 L430 355 C425 320 395 295 360 295 C325 295 295 320 290 355 L210 355 C205 320 175 295 140 295 C115 295 90 310 80 335 Z" fill="url(#neon)"/>
    <!-- Cockpit Canopy -->
    <path d="M260 230 L350 215 C365 215 380 230 390 255 L275 270 Z" fill="#080b12" opacity="0.85"/>
    <!-- Wheel Glows -->
    <circle cx="140" cy="355" r="38" fill="#04060a" stroke="#06b6d4" stroke-width="8"/>
    <circle cx="140" cy="355" r="16" fill="#38bdf8"/>
    <circle cx="360" cy="355" r="38" fill="#04060a" stroke="#06b6d4" stroke-width="8"/>
    <circle cx="360" cy="355" r="16" fill="#38bdf8"/>
    <!-- Headlight Beam -->
    <polygon points="460,305 510,290 510,335 460,325" fill="#38bdf8" opacity="0.8"/>
  </g>
</svg>
